name: Core validation
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tests/check_browser_engine.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/learning_browser_smoke.py
        env:
          SCREENSHOT_DIR: artifacts
      - run: python tests/browser_smoke.py
      - run: python tests/standalone_smoke.py
      - run: python tests/entry_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-ui
          path: artifacts/*.png
